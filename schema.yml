components:
  schemas:
    AuthToken:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        token:
          type: string
          readOnly: true
      required:
      - password
      - token
      - username
    Client:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          $ref: '#/components/schemas/User'
        customer:
          type: string
          format: uuid
        customer_name:
          type: string
          readOnly: true
        job_title:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 32
        is_primary_contact:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - customer
      - customer_name
      - id
      - updated_at
      - user
    ClientLoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
        client:
          allOf:
          - $ref: '#/components/schemas/Client'
          nullable: true
      required:
      - client
      - token
      - user
    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 32
        billing_address: {}
        tax_id:
          type: string
          maxLength: 64
        status:
          $ref: '#/components/schemas/CustomerStatusEnum'
        metadata: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - id
      - name
      - updated_at
    CustomerStatusEnum:
      enum:
      - active
      - inactive
      - suspended
      type: string
      description: |-
        * `active` - Active
        * `inactive` - Inactive
        * `suspended` - Suspended
    Invoice:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        number:
          type: string
          maxLength: 64
        status:
          $ref: '#/components/schemas/InvoiceStatusEnum'
        currency:
          type: string
          maxLength: 3
        subtotal:
          type: string
          format: decimal
